name: Build and release

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish executable
        run: dotnet publish .\src\AutoMovement.csproj --configuration Release --output .\publish

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: build-${{ github.run_number }}
        run: gh release create "$env:RELEASE_TAG" ".\publish\AutoMovement.exe" ".\publish\AutoMovement.exe.config" --target "$env:GITHUB_SHA" --title "Build $env:GITHUB_RUN_NUMBER" --generate-notes
